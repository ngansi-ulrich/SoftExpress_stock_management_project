{% load static %}
<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Email envoyé — Gestion de Stock</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Nunito:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="{% static 'css/style.css' %}"/>
</head>
<body>

  <div class="bg"></div>
  <div class="grid-lines"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="card">

    <div class="logo-wrap">
      <img class="logo-img" src="{% static 'img/logo.png' %}" alt="Logo"/>
      <div class="app-name">Email envoyé</div>
    </div>

    <p style="text-align:center; margin-bottom: 20px; opacity: 0.8;">
      Si un compte existe avec cette adresse, vous recevrez un lien de
      réinitialisation sous peu. Vérifiez aussi vos courriers indésirables.
    </p>

    <div class="card-footer">
      <a href="{% url 'Login' %}" style="color: inherit;">&larr; Retour à la connexion</a>
    </div>

  </div>

  <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
