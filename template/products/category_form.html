<div class="modal fade" 
     id="categoryModal" 
     tabindex="-1" 
     aria-hidden="true">


<div class="modal-dialog modal-lg modal-dialog-centered">


<div class="modal-content">



<!-- Header -->

<div class="modal-header">


<h5 class="modal-title">


<i class="bi bi-diagram-3 me-2"></i>


Add Product Category


</h5>



<button 
type="button"
class="btn-close"
data-bs-dismiss="modal">

</button>


</div>





<form method="POST"
      enctype="multipart/form-data">


{% csrf_token %}



<div class="modal-body">


<div class="row">



<!-- Category Name -->

<div class="col-md-6 mb-3">


<label class="form-label">

Category Name

</label>


<input
type="text"
class="form-control"
placeholder="Example: Laptops"
required>


</div>





<!-- Parent Category -->

<div class="col-md-6 mb-3">


<label class="form-label">

Parent Category

</label>


<select class="form-select">


<option>

No Parent

</option>


<option>

Computers

</option>


<option>

Accessories

</option>


<option>

Networking

</option>


</select>


</div>





<!-- Icon -->

<div class="col-md-6 mb-3">


<label class="form-label">

Category Icon

</label>


<input
type="text"
class="form-control"
placeholder="bi-laptop">


<small class="text-muted">

Bootstrap icon class

</small>


</div>





<!-- Image -->

<div class="col-md-6 mb-3">


<label class="form-label">

Category Image

</label>


<input
type="file"
class="form-control">


</div>





<!-- Description -->

<div class="col-12 mb-3">


<label class="form-label">

Description

</label>


<textarea
class="form-control"
rows="4"
placeholder="Describe this category">

</textarea>


</div>





<!-- Status -->

<div class="col-md-6 mb-3">


<label class="form-label">

Status

</label>


<select class="form-select">


<option value="active">

Active

</option>


<option value="inactive">

Inactive

</option>


</select>


</div>





</div>


</div>






<!-- Footer -->


<div class="modal-footer">


<button
type="button"
class="btn btn-secondary"
data-bs-dismiss="modal">


Cancel


</button>




<button
type="submit"
class="btn btn-primary">


<i class="bi bi-check-circle me-2"></i>


Save Category


</button>


</div>



</form>



</div>


</div>


</div>
