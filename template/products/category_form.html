<div
    class="modal fade {% if show_category_modal %}show{% endif %}"
    id="categoryModal"
    tabindex="-1"
    aria-hidden="true"
    {% if show_category_modal %}style="display: block;"{% endif %}>

    <div class="modal-dialog modal-lg modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    <i class="bi bi-diagram-3 me-2"></i>
                    Add Product Category
                </h5>

                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>

            </div>

            <form method="POST" action="{% url 'category_create' %}">

                {% csrf_token %}

                <div class="modal-body">
                    {% include 'products/_category_fields.html' %}
                </div>

                <div class="modal-footer">

                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Cancel
                    </button>

                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle me-2"></i>
                        Save Category
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% if show_category_modal %}
<div class="modal-backdrop fade show"></div>
{% endif %}
