{% extends 'base.html' %}


{% block title %}

Stock Adjustment

{% endblock %}



{% block content %}


<div class="container-fluid">


<!-- Header -->

<div class="d-flex justify-content-between align-items-center mb-4">


<div>


<h2 class="fw-bold">


<i class="bi bi-sliders me-2"></i>


Stock Adjustment


</h2>


<p class="text-muted">


Modify inventory quantities with proper tracking.


</p>


</div>



<a href="#" class="btn btn-outline-primary">


<i class="bi bi-clock-history me-2"></i>


View History


</a>


</div>





<!-- Form Card -->


<div class="card">


<div class="card-body">


<form method="POST">


{% csrf_token %}



<div class="row g-4">





<!-- Product -->


<div class="col-md-6">


<label class="form-label">


Product


</label>



<select class="form-select">


<option>

Select Product

</option>


<option>

HP EliteBook 840 G8

</option>


<option>

Dell Monitor

</option>


<option>

Canon Printer

</option>


</select>


</div>





<!-- Agency -->


<div class="col-md-6">


<label class="form-label">


Agency


</label>



<select class="form-select">


<option>

Select Agency

</option>


<option>

Douala

</option>


<option>

Yaoundé

</option>


<option>

Bafoussam

</option>


</select>


</div>






<!-- Adjustment Type -->


<div class="col-md-6">


<label class="form-label">


Adjustment Type


</label>



<select class="form-select">


<option value="add">

Add Stock (+)

</option>


<option value="remove">

Remove Stock (-)

</option>


<option value="correction">

Correction

</option>


</select>



</div>





<!-- Quantity -->


<div class="col-md-6">


<label class="form-label">


Quantity


</label>



<input

type="number"

class="form-control"

placeholder="Enter quantity">


</div>





<!-- Reason -->


<div class="col-md-12">


<label class="form-label">


Reason


</label>



<textarea

class="form-control"

rows="4"

placeholder="Example: New supplier delivery">

</textarea>



</div>






<!-- Responsible User -->


<div class="col-md-6">


<label class="form-label">


Responsible Employee


</label>



<select class="form-select">


<option>

Admin

</option>


<option>

Agency Manager

</option>


<option>

Store Keeper

</option>


</select>



</div>





<!-- Reference -->


<div class="col-md-6">


<label class="form-label">


Reference Number


</label>



<input

type="text"

class="form-control"

placeholder="PO-2026-001">


</div>



</div>





<hr class="my-4">





<div class="d-flex justify-content-end">


<button

type="reset"

class="btn btn-secondary me-2">


Cancel


</button>




<button

type="submit"

class="btn btn-primary">


<i class="bi bi-check-circle me-2"></i>


Save Adjustment


</button>



</div>



</form>


</div>


</div>




</div>


{% endblock %}
