{% extends 'base.html' %}

{% block title %}Edit Agency{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="mb-4">
        <h2 class="fw-bold">
            <i class="bi bi-building me-2"></i>
            Edit Agency
        </h2>
        <p class="text-muted">Update this agency's information.</p>
    </div>

    {% include 'components/messages.html' %}

    <div class="card">

        <div class="card-body">

            <form method="POST">

                {% csrf_token %}

                {% include 'agencies/_agency_fields.html' %}

                <div class="d-flex justify-content-end gap-2 mt-3">

                    <a href="{% url 'agency_list' %}" class="btn btn-secondary">
                        Cancel
                    </a>

                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle me-2"></i>
                        Save Changes
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
