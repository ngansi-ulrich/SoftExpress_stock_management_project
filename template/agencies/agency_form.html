<!-- Agency Modal (Add only) -->
<div
    class="modal fade {% if show_agency_modal %}show{% endif %}"
    id="agencyModal"
    tabindex="-1"
    aria-hidden="true"
    {% if show_agency_modal %}style="display: block;"{% endif %}>

    <div class="modal-dialog modal-lg modal-dialog-centered">

        <div class="modal-content">

            <!-- Header -->

            <div class="modal-header">

                <h5 class="modal-title">

                    <i class="bi bi-building me-2"></i>

                    Add New Agency

                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <!-- Form -->

            <form method="POST" action="{% url 'agency_create' %}">

                {% csrf_token %}

                <div class="modal-body">

                    {% include 'agencies/_agency_fields.html' %}

                </div>

                <!-- Footer -->

                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                        Cancel

                    </button>

                    <button
                        type="submit"
                        class="btn btn-primary">

                        <i class="bi bi-check-circle me-2"></i>

                        Save Agency

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% if show_agency_modal %}
<div class="modal-backdrop fade show"></div>
{% endif %}
